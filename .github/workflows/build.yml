name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 下载 xipm 工具链
        run: |
          curl -sL -o xipm.tar.gz "https://github.com/ximeiorg/Xime/releases/download/v3.4.2/xipm-0.2.0-x86_64-unknown-linux-gnu.tar.gz"
          tar xzf xipm.tar.gz && chmod +x xipm
          ./xipm --version

      - name: 单元测试
        run: ./xipm test plugins/tone-comment

      - name: 打包 xipk
        run: ./xipm pack

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: tone-comment-xipk
          path: build/plugin-release/tone-comment-*.xipk

      - name: 发布 Release（仅 tag）
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" build/plugin-release/tone-comment-*.xipk \
            --title "拼音声调标注 ${GITHUB_REF_NAME}" \
            --notes "候选注释显示带声调拼音。安装：扩展商店 → 本地管理 → 导入 xipk。全键盘模式生效；九键（T9）候选面板暂不支持注释显示，详见 README。"
